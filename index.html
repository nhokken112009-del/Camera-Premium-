<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Camera Horror ☠️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
#camera{width:100%;height:100%;object-fit:cover;background:#050505}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none}
.rec{position:absolute;top:18px;left:18px;font-size:16px;color:#f00;text-shadow:0 0 8px #f00}
.rec:before{content:"";display:inline-block;width:11px;height:11px;background:red;border-radius:50%;margin-right:7px;box-shadow:0 0 12px red}
.battery{position:absolute;top:18px;right:18px;font-size:14px}
.time{position:absolute;bottom:18px;left:18px;font-size:14px}
#start{
position:fixed;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;
background:#000;color:#fff;text-align:center
}
#start button{
background:#111;color:#fff;border:1px solid #777;border-radius:10px;
padding:18px 28px;font-size:18px;font-family:monospace;
box-shadow:0 0 25px #333
}
#count{
position:fixed;z-index:4;inset:0;display:none;align-items:center;justify-content:center;
font-size:100px;color:#fff;text-shadow:0 0 30px red
}
#static{
position:fixed;z-index:6;inset:0;display:none;background:#fff;
mix-blend-mode:screen;opacity:.85;
}
#ghost{
position:fixed;z-index:7;inset:0;display:none;background:#000;
align-items:center;justify-content:center;
}
#ghost img{width:100%;height:100%;object-fit:cover}
#flash{position:fixed;z-index:8;inset:0;background:#fff;display:none}
#final{
position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;
background:#000;color:#f00;font-size:30px;text-align:center
}
.shake{animation:shake .055s infinite}
@keyframes shake{
0%{transform:translate(0,0) rotate(0)}
25%{transform:translate(8px,-5px) rotate(-1deg)}
50%{transform:translate(-7px,6px) rotate(1deg)}
75%{transform:translate(5px,4px) rotate(-1deg)}
100%{transform:translate(-4px,-6px) rotate(1deg)}
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div id="ui">
  <div class="rec">REC</div>
  <div class="battery">▮▮▮▮ 87%</div>
  <div class="time" id="clock">00:00:00</div>
</div>

<div id="start">
  <div>
    <h2>☠️ CAMERA HORROR</h2>
    <p>Cho phép truy cập camera để bắt đầu</p>
    <button onclick="startCamera()">▶ BẮT ĐẦU</button>
  </div>
</div>

<div id="count">5</div>
<div id="static"></div>
<div id="ghost"><img src="ghost.png" alt="ghost"></div>
<div id="flash"></div>
<div id="final">BỊ TROLL RỒI ☠️<br><small>Camera vẫn bình thường.</small></div>

<script>
const video=document.getElementById("camera");
const start=document.getElementById("start");
const count=document.getElementById("count");
const ghost=document.getElementById("ghost");
const flash=document.getElementById("flash");
const final=document.getElementById("final");
const stat=document.getElementById("static");

let stream;

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    start.style.display="none";
    countdown();
  }catch(e){
    alert("Không mở được camera. Hãy cấp quyền Camera cho trình duyệt.");
  }
}

function countdown(){
  count.style.display="flex";
  let n=5;
  count.textContent=n;
  const t=setInterval(()=>{
    n--;
    if(n>0) count.textContent=n;
    else{
      clearInterval(t);
      count.style.display="none";
      setTimeout(jumpscare,800);
    }
  },1000);
}

function jumpscare(){
  // Hiệu ứng nhiễu
  stat.style.display="block";
  stat.classList.add("shake");

  setTimeout(()=>{
    stat.style.display="none";
    ghost.style.display="flex";
    ghost.classList.add("shake");
    flash.style.display="block";

    if(navigator.vibrate) navigator.vibrate([100,50,180,50,300]);

    setTimeout(()=>flash.style.display="none",80);

    setTimeout(()=>{
      ghost.style.display="none";
      ghost.classList.remove("shake");
      final.style.display="flex";

      // Tắt camera sau khi trò troll kết thúc
      if(stream) stream.getTracks().forEach(track=>track.stop());
    },1800);
  },500);
}

// Đồng hồ giả
let sec=0;
setInterval(()=>{
  sec++;
  let h=String(Math.floor(sec/3600)).padStart(2,"0");
  let m=String(Math.floor(sec%3600/60)).padStart(2,"0");
  let s=String(sec%60).padStart(2,"0");
  document.getElementById("clock").textContent=`${h}:${m}:${s}`;
},1000);
</script>
</body>
</html>
